name: macos-build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go tests
        run: go test ./...

      - name: Xcode tests (no signing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project apps/macos/ZeroPass/ZeroPass.xcodeproj \
            -scheme ZeroPass \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | cat
        env:
          NSUnbufferedIO: 'YES'

  archive:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Archive (unsigned)
        run: |
          bash apps/macos/scripts/build.sh
        env:
          CODE_SIGNING_ALLOWED: 'NO'

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPass-xcarchive
          path: dist/macos/ZeroPass.xcarchive

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPass-zip
          path: dist/macos/ZeroPass.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPass-dmg
          path: dist/macos/ZeroPass.dmg
